<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock title %} | Portfolio</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #F4F8FC;
            color: #243447;
            font-family: Arial, sans-serif;
        }


        .navbar-translucent {
            background-color: #FFFFFF;
            border-bottom: 1px solid #E5EAF0;
            box-shadow: 0 2px 8px rgba(36, 52, 71, 0.05);
        }

    
        .navbar .navbar-brand {
            color: #243447;
            font-weight: bold;
        }

    
        .navbar .nav-link {
            color: #243447;
            transition: color 0.3s ease;
        }

    
        .navbar .nav-link:hover {
            color: #5271FF;
        }

    
        .navbar .navbar-toggler {
            border-color: #D5DDE8;
        }

        .navbar .navbar-toggler:focus {
            box-shadow: 0 0 0 0.15rem rgba(82, 113, 255, 0.25);
        }

    
        h1, h2, h3, h4, h5, h6 {
            color: #243447;
        }

    
        a {
            color: #5271FF;
        }

        a:hover {
            color: #354FC7;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-translucent">
        <div class="container-fluid">

            <a class="navbar-brand" href="{% url 'index' %}">My Portfolio</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'about' %}">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'skill' %}">Skills</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'project' %}">Projects</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'resume' %}">Resume</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'contact' %}">Contact</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    {% block body %}{% endblock body %}

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
